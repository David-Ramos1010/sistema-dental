info:
  name: Solicitar recuperacion de contrasena
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/olvide-password"
  body:
    type: json
    data: |-
      {
        "email": "{{pacienteEmail}}"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("la solicitud se acepta", function () {
          expect(res.status).to.equal(200);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
