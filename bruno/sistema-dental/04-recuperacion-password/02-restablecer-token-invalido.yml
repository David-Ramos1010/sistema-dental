  url: "{{baseUrl}}/api/auth/restablecer-password"
  body:
    type: json
    data: |-
      {
        "token": "token-de-recuperacion-invalido",
        "nuevaPassword": "Nueva#2027x"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("un token de recuperacion invalido se rechaza (4xx)", function () {
          expect(res.status).to.be.within(400, 499);
        });

