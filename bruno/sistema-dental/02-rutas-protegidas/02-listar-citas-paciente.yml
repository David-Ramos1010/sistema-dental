info:
  name: Listar citas del paciente
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/citas"
  auth:
    type: bearer
    token: "{{pacienteToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("devuelve una lista de citas", function () {
          const b = res.body;
          const lista = Array.isArray(b) ? b : (b.content || b.citas || []);
          expect(lista).to.be.an("array");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
