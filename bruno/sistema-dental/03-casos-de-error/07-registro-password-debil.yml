  url: "{{baseUrl}}/api/auth/registro"
  body:
    type: json
    data: |-
      {
        "nombre": "Paciente Debil",
        "email": "debil.{{$timestamp}}@correo.test",
        "password": "abc",
        "telefono": "+529511234567"
      }
