info:
  name: ERROR - Login con contrasena incorrecta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "ContrasenaIncorrecta#1"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("credenciales invalidas: no se entrega ningun token", function () {
          const b = res.body || {};
          expect(b.token || b.accessToken || b.jwt).to.be.undefined;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

docs:
  content: |-
    Error esperado: **401 Unauthorized**. Credenciales incorrectas.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
