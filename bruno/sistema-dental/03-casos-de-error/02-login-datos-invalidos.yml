info:
  name: ERROR - Login con datos invalidos (email nulo)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": null,
        "password": "Admin#2026"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("la validacion rechaza el body y no hay token", function () {
          const b = res.body || {};
          expect(b.token || b.accessToken || b.jwt).to.be.undefined;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

docs:
  content: |-
    Error esperado: **400 Bad Request**. El campo `email` es obligatorio.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
