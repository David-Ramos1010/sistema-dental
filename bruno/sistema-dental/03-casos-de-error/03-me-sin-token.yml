info:
  name: ERROR - Ruta protegida sin token
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("sin token se deniega el acceso (401 o 403)", function () {
          expect([401, 403]).to.include(res.status);
        });

docs:
  content: |-
    Acceso denegado: no se envia el header `Authorization`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
